name: escuela_api

services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-escuela}:${POSTGRES_PASSWORD:-escuela_local_only}@db:5432/${POSTGRES_DB:-escuela_api}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - npm_cache:/root/.npm
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escuela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escuela_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-escuela_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  node_modules:
  next_cache:
  npm_cache:
